        supa.rest('no_renovation_skus', { select: 'sku', limit: 1000 }),
      ]);
      $('#rm-cats').innerHTML = cats.length ? cats.map(c => `<div class="li-row"><span>${esc(c.category_name)}</span><span class="badge ${c.is_active ? 'teal' : 'red'}">${c.is_active ? '启用' : '停用'}</span></div>`).join('') : '<div class="empty">无分类</div>';
      const bindCount = binds ? binds.length : 0;
      $('#rm-binds').innerHTML = bindCount ? `<div class="li-row"><span>绑定记录:<b>${fmtQty(bindCount)}</b></span></div>${binds.slice(0, 30).map(b => `<div class="li-row"><span>${esc(JSON.stringify(Object.values(b).slice(1, 4)).replace(/["\[\]]/g, ''))}</span></div>`).join('')}<div style="font-size:11px;color:var(--muted);margin-top:6px">仅显示前 30 条</div>` : '<div class="empty">暂无绑定数据</div>';
      const div = document.createElement('div');
      div.className = 'card'; div.style.marginTop = '12px';
      div.innerHTML = `<div class="card-title">无需翻新 SKU 列表（${noReno.length}）</div><div style="max-height:200px;overflow:auto;font-size:12px;color:var(--muted-foreground)">${noReno.slice(0, 100).map(x => esc(x.sku)).join('、')}</div>${noReno.length > 100 ? '<div style="font-size:11px;margin-top:4px">… 共 ' + noReno.length + ' 个</div>' : ''}`;
      container.querySelector('.page-body').appendChild(div);
    } catch (e) { $('#rm-cats').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
  } else {
    $('#rm-cats').innerHTML = '<div class="empty">请在云端模式使用（本地模式未实现）</div>';
    $('#rm-binds').innerHTML = '<div class="empty">-</div>';
  }
}

/* ===== 库存申请单 ===== */
async function renderStockApply(container) {
  const STATUS = { pending: '<span class="badge" style="background:#fff7ed;color:#c2410c">待处理</span>', approved: '<span class="badge teal">已通过</span>', rejected: '<span class="badge red">已驳回</span>' };
  container.innerHTML = navbar('库存申请单', true, `<button class="btn tiny primary" id="sa-add">+ 申请</button>`) + `
  <div class="page-body">
    <div class="filter-row" id="sa-filter">
      <button class="chip active" data-v="">全部</button><button class="chip" data-v="pending">待处理</button><button class="chip" data-v="approved">已通过</button><button class="chip" data-v="rejected">已驳回</button>
    </div>
    <div id="sa-list"><div class="loading">加载中...</div></div>
  </div>`;
  let filt = '';
  const u = getUser();
  const load = async () => {
    const listEl = $('#sa-list');
    listEl.innerHTML = '<div class="loading">加载中...</div>';
    try {
      let list;
      if (isCloud()) {
        list = await supa.rest('stock_applications', { select: 'id,sku,qty,applicant,status,remark,created_at,handled_at,handler', filter: filt ? `status=eq.${filt}` : '', order: 'created_at.desc', limit: 200 });
      } else {
        const r = await api('/stock-apply' + (filt ? `?status=${filt}` : ''));
        list = r.list;
      }
      if (!list.length) return listEl.innerHTML = '<div class="empty"><span class="emoji">📭</span>暂无申请</div>';
      listEl.innerHTML = list.map(x => `
      <div class="list-item">
        <div class="li-head"><span class="li-name">${esc(x.sku)}</span>
          <span style="display:flex;gap:5px;align-items:center">${STATUS[x.status] || ''}<span style="font-size:13px;font-weight:700">${fmtQty(x.qty)}</span></span></div>
        <div class="li-row"><span>申请人:${esc(x.applicant || '-')}</span><span>${esc((x.created_at || '').replace('T', ' ').slice(0, 16))}</span></div>
        ${x.remark ? `<div class="li-row"><span>备注:${esc(x.remark)}</span></div>` : ''}
        ${x.status !== 'pending' && x.handler ? `<div class="li-row"><span>处理人:${esc(x.handler)} ${esc((x.handled_at || '').replace('T', ' ').slice(0, 16))}</span></div>` : ''}
        ${x.status === 'pending' && isAdmin() ? `<div class="li-actions"><button class="btn tiny primary" data-ok="${x.id}">通过</button><button class="btn tiny danger" data-no="${x.id}">驳回</button></div>` : ''}
      </div>`).join('');
      listEl.querySelectorAll('[data-ok]').forEach(b => b.onclick = async () => { await handleApply(b.dataset.ok, 'approved'); load(); });
      listEl.querySelectorAll('[data-no]').forEach(b => b.onclick = async () => { await handleApply(b.dataset.no, 'rejected'); load(); });
    } catch (e) { listEl.innerHTML = `<div class="empty"><span class="emoji">😳</span>${esc(e.message)}</div>`; }
  };
  async function handleApply(id, status) {
    try {
      if (isCloud()) {
        await supa.update('stock_applications', `id=eq.${id}`, { status, handled_at: new Date().toISOString(), handler: u?.username || '' });
      } else { await api('/stock-apply/' + id, { method: 'PUT', body: { status } }); }
      toast('已' + (status === 'approved' ? '通过' : '驳回'));
    } catch (e) { toast(e.message, true); }
  }
  $('#sa-filter').querySelectorAll('.chip').forEach(ch => ch.onclick = () => {
    filt = ch.dataset.v;
    $('#sa-filter').querySelectorAll('.chip').forEach(x => x.classList.toggle('active', x === ch)); load();
  });
  $('#sa-add').onclick = () => {
    const html = `<div style="padding:16px">
      <div class="field"><label class="req">SKU</label><div class="input-group"><input id="sf-sku" placeholder="输入或扫 SKU"><button class="btn tiny ghost" onclick="scanCode('sf-sku','sku')">📷</button></div></div>
      <div class="field"><label class="req">申请数量</label><input class="inp" id="sf-qty" type="number" min="1"></div>
      <div class="field"><label>备注</label><input class="inp" id="sf-remark" placeholder="用途/说明"></div>
      <button class="btn primary" id="sf-submit" style="width:100%">提交申请</button></div>`;
    const dlg = el('div', 'modal-mask');
    dlg.innerHTML = `<div class="modal" style="max-width:420px;margin:auto;...">${navbar('提交库存申请', true)}${html}</div>`;
    dlg.style.cssText = 'position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center';
    const box = el('div');
    box.style.cssText = 'background:#fff;border-radius:16px;max-width:440px;width:88%;padding:0 0 14px';
    box.innerHTML = navbar('提交库存申请', true) + html;
    dlg.innerHTML = ''; dlg.appendChild(box);
    document.body.appendChild(dlg);
    box.querySelector('.back').onclick = () => dlg.remove();
    box.querySelector('#sf-submit').onclick = async () => {
      const sku = trim(box.querySelector('#sf-sku').value), qty = Number(box.querySelector('#sf-qty').value);
      const remark = trim(box.querySelector('#sf-remark').value);
      if (!sku || qty <= 0) return toast('SKU 和数量必填', true);
      try {
        if (isCloud()) {
          await supa.insert('stock_applications', { sku, qty, applicant: u?.username || '', status: 'pending', remark, created_by: u?.id || null });
        } else { await api('/stock-apply', { method: 'POST', body: { sku, qty, remark } }); }
        supa.invalidate();
        toast('申请已提交');
        dlg.remove(); load();
      } catch (e) { toast(e.message, true); }
    };
  };
  load();
}

/* ===== 字体大小设置（仅本机本视角生效）===== */
function applyFontScale() {
  const s = Number(localStorage.getItem('xiaoan_font_scale') || 1);
  const map = { 1: '14px', 1.15: '16px', 1.3: '18px', 1.5: '21px' };
  document.documentElement.style.fontSize = map[s] || '14px';
}
applyFontScale();
async function renderFontSetting(container) {
  const cur = Number(localStorage.getItem('xiaoan_font_scale') || 1);
  const opts = [
    { v: 1, label: '标准', sub: '默认大小' },
    { v: 1.15, label: '中号', sub: '稍大，适合日常' },
    { v: 1.3, label: '大号', sub: '适合远距离/光线不足' },
    { v: 1.5, label: '特大号', sub: '最大字号' },
  ];
  container.innerHTML = navbar('字体大小', true) + `
  <div class="page-body">
    <div class="card" style="padding:4px 0">
      ${opts.map(o => `
      <div class="menu-item" data-v="${o.v}" style="cursor:pointer;padding:12px 16px;${Number(o.v) === cur ? 'background:var(--primary-soft)' : ''}">
        <span style="flex:1">
          <div style="font-size:${14 * o.v}px;font-weight:${Number(o.v) === cur ? 700 : 500}">${o.label}</div>
          <div style="font-size:11px;color:var(--muted-foreground)">${o.sub}</div>
        </span>
        ${Number(o.v) === cur ? '<span style="color:var(--primary);font-size:18px">✓</span>' : '<span class="m-arrow">›</span>'}
      </div>`).join('')}
    </div>
    <div style="font-size:12px;color:var(--muted-foreground);margin-top:12px;line-height:1.6;padding:0 4px">
      字号设置仅对<b>当前设备</b>生效，不影响其他员工。选完立即生效。
    </div>
    <div style="margin-top:14px;padding:14px;background:var(--background);border-radius:12px">
      <div style="font-size:12px;color:var(--muted);margin-bottom:8px">预览：</div>
      <div class="list-item" style="margin:0">
        <div class="li-head"><span class="li-name">A121D621</span><span class="badge teal">样品</span></div>
        <div class="li-row"><span>系统库存:<b>1,364</b></span><span>实物:<b>1,569</b></span></div>
      </div>
    </div>
  </div>`;
  container.querySelectorAll('[data-v]').forEach(el => el.onclick = () => {
    localStorage.setItem('xiaoan_font_scale', el.dataset.v);
    applyFontScale();
    renderFontSetting(container);
  });
}
